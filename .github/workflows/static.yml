# Simple workflow for deploying static content to Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main", "testing"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare Files for Main Branch
        if: github.ref == 'refs/heads/main'
        run: |
          # För main ser vi till att CNAME finns kvar och att allt ligger i roten
          echo "Deploying main branch to root"

      - name: Prepare Files for Testing Branch
        if: github.ref == 'refs/heads/testing'
        run: |
          # Ta bort CNAME så den inte krockar
          rm -f CNAME
          rm -rf .github docs test

          # Skapa en ren undermapp 'testing' och flytta dit allt
          mkdir public_root
          mkdir public_root/testing
          
          shopt -s extglob
          mv !(public_root) public_root/testing/
          
          shopt -u extglob
          mv public_root/* .
          rmdir public_root

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
