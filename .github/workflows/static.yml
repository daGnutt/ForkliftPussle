name: Deploy Pages

on:
  push:
    branches: ["main", "testing"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node (om behövs, hoppa över om ren statisk HTML)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build / Prepare Files
        run: |
          mkdir -p build_output
          
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "Building MAIN for root..."
            # Kopiera allt förutom mappar vi inte vill ha till roten
            rsync -av --exclude='.git' --exclude='.github' --exclude='docs' --exclude='test' ./ build_output/
          elif [ "${{ github.ref }}" = "refs/heads/testing" ]; then
            echo "Building TESTING for /testing folder..."
            # Här vill vi ha filerna i en undermapp som heter testing
            mkdir -p build_output/testing
            rsync -av --exclude='.git' --exclude='.github' --exclude='docs' --exclude='test' --exclude='CNAME' ./ build_output/testing/
          fi

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./build_output
          keep_files: true # VIKTIGT: Detta gör att den INTE skriver över det som redan ligger på den andra branchen!
          enable_jekyll: false
