<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Forklift Frenzy</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>
  <div id="record" class="hide">
    <form id="recordForm" autocomplete="off">
      <h2>New high score!</h2>
      <p id="recordInfo"></p>
      <label>Name <input id="recordName" type="text" maxlength="16" spellcheck="false"></label>
      <button type="submit">Save</button>
    </form>
  </div>
  <div id="splash">
    <div class="boxes"><i style="--c:#e53935"></i><i style="--c:#1e88e5"></i><i style="--c:#43a047"></i></div>
    <h1>Forklift <span>Frenzy</span></h1>
    <p>Stack the boxes. Park the forklift. Mind the tail swing.</p>
    <form id="seedForm" autocomplete="off">
      <label>Seed <input id="seed" type="text" maxlength="32" placeholder="default" spellcheck="false"></label>
      <button type="button" id="seedRandom" title="Random seed" aria-label="Random seed"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
      <button type="submit">Start</button>
    </form>
    <p class="press">Press any key to start</p>
  </div>
  <footer>
    <b>↑/↓</b> drive &nbsp; <b>←/→</b> steer (rear wheels steer!) &nbsp; <b>Space</b> brake &nbsp;
    <b>A</b> forks up &nbsp; <b>Z</b> forks down &nbsp; <b>R</b> restart &nbsp; <b>N</b>/<b>P</b> next/prev level &nbsp; <b>G</b> go to level &nbsp; <b>M</b> mute music
  </footer>
  <script type="module" src="js/main.js"></script>
</body>
</html>
