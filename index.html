<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Forklift Frenzy</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>
  <div id="splash">
    <div class="boxes"><i style="--c:#e53935"></i><i style="--c:#1e88e5"></i><i style="--c:#43a047"></i></div>
    <h1>Forklift <span>Frenzy</span></h1>
    <p>Stack the boxes. Park the forklift. Mind the tail swing.</p>
    <p class="press">Press any key to start</p>
  </div>
  <footer>
    <b>↑/↓</b> drive &nbsp; <b>←/→</b> steer (rear wheels steer!) &nbsp; <b>Space</b> brake &nbsp;
    <b>A</b> forks up &nbsp; <b>Z</b> forks down &nbsp; <b>R</b> restart &nbsp; <b>N</b>/<b>P</b> next/prev level &nbsp; <b>M</b> mute music
  </footer>
  <script type="module" src="js/main.js"></script>
</body>
</html>
