<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Forklift Puzzle</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>
  <footer>
    <b>↑/↓</b> drive &nbsp; <b>←/→</b> steer (rear wheels steer!) &nbsp; <b>Space</b> brake &nbsp;
    <b>A</b> forks up &nbsp; <b>Z</b> forks down &nbsp; <b>R</b> restart &nbsp; <b>N</b>/<b>P</b> next/prev level &nbsp; <b>M</b> mute music
  </footer>
  <script type="module" src="js/main.js"></script>
</body>
</html>
